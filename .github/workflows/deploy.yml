name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  RAILWAY_PROJECT_ID: db6865d1-da2c-4640-ab95-090d8b73bf98
  RAILWAY_ENVIRONMENT_ID: 568a6180-3144-482a-a02a-8a4091f1ab05
jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify deployment source is the triggered immutable commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Link and verify the 17407 production project
        run: |
          npx -y @railway/cli@latest link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --json >/dev/null
          test "$(npx -y @railway/cli@latest status --json | jq -r .id)" = "$RAILWAY_PROJECT_ID"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_17407 }}
      - name: Label deployments with the immutable commit
        run: |
          printf '%s' "$GITHUB_SHA" | npx -y @railway/cli@latest variable set DEPLOYMENT_VERSION --stdin --service google-connector-app --skip-deploys >/dev/null
          printf '%s' "$GITHUB_SHA" | npx -y @railway/cli@latest variable set DEPLOYMENT_VERSION --stdin --service google-connector-worker --skip-deploys >/dev/null
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_17407 }}
      - name: Deploy backend with Railway CLI
        run: npx -y @railway/cli@latest up --service google-connector-app --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_17407 }}
      - name: Deploy durable worker with Railway CLI
        run: npx -y @railway/cli@latest up --service google-connector-worker --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_17407 }}
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deploy frontend with current Vercel CLI
        run: >-
          npx -y vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
          --build-env DEPLOYMENT_VERSION="$GITHUB_SHA"
          --build-env CANDIDATE_FRONTEND_ROLE=control
          --env DEPLOYMENT_VERSION="$GITHUB_SHA"
          --env CANDIDATE_FRONTEND_ROLE=control
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  attest-production:
    needs: [deploy-backend, deploy-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install attestation transport only
        run: pip install 'httpx==0.28.1'
      - name: Link and verify the 17407 production project
        run: |
          npx -y @railway/cli@latest link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --json >/dev/null
          test "$(npx -y @railway/cli@latest status --json | jq -r .id)" = "$RAILWAY_PROJECT_ID"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_17407 }}
      - name: Attest exact production API, worker, and frontend deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_17407 }}
          CANDIDATE_ATTESTATION_URL: ${{ secrets.CANDIDATE_ATTESTATION_URL }}
          CANDIDATE_DEPLOY_ATTESTATION_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_ATTESTATION_TOKEN }}
          PRODUCTION_COMMIT: ${{ github.sha }}
          PRODUCTION_FRONTEND_URL: https://google-connector-app.vercel.app
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        run: python scripts/attest_production_deployment.py

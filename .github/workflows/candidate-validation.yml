name: Governed candidate validation
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agent_db
          POSTGRES_USER: agent_user
          POSTGRES_PASSWORD: agent_pass_2024
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agent_user -d agent_db"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: ': > candidate-tests.log'
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt bandit pip-audit
      - run: pip install -r requirements-orchestration.txt
      - name: Validate candidate with no production credentials
        env:
          ALLOW_DEV_AUTH: 'true'
          JWT_SECRET_KEY: automated-test-only-secret-at-least-32-bytes
          DATABASE_URL: postgresql://agent_user:agent_pass_2024@localhost:5432/agent_db
          ASYNC_DATABASE_URL: postgresql+asyncpg://agent_user:agent_pass_2024@localhost:5432/agent_db
          COST_LEDGER_TEST_DSN: postgresql://agent_user:agent_pass_2024@127.0.0.1:5432/agent_db
        run: |
          {
            python -m compileall -q app scripts
            alembic upgrade head
            pytest tests/ -q
            python scripts/run_golden_evals.py
            python scripts/run_chunking_evals.py
            python scripts/run_workflow_replays.py
            python scripts/run_policy_evals.py
            python scripts/run_context_packing_evals.py
            python scripts/run_dp_allocation_evals.py
            python scripts/run_dual_worker_simulation.py
            python scripts/sync_grafana_dashboards.py
            python -m flake8 app scripts tests migrations
            bandit -q -r app scripts -ll
            pip-audit -r requirements.txt --progress-spinner off
            python scripts/verify_cloud_migrations_local.py
            docker build -f Dockerfile.worker -t candidate-worker:test .
            docker build -f Dockerfile.candidate -t candidate-api:test .
            docker build -f Dockerfile.builder -t candidate-builder:test .
          } 2>&1 | tee candidate-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-backend-log
          path: candidate-tests.log

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: ': > candidate-web.log'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Validate candidate web
        run: |
          {
            npm run lint
            npm run build
            npm audit --omit=dev --audit-level=critical
          } 2>&1 | tee candidate-web.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-web-log
          path: web/candidate-web.log

  flutter:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: ': > candidate-flutter.log'
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - name: Validate candidate mobile
        run: |
          {
            flutter analyze
            flutter test
            flutter build apk --debug
          } 2>&1 | tee candidate-flutter.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-flutter-log
          path: mobile/candidate-flutter.log

  coding-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coding_runtime
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
      - name: Validate candidate Rust broker
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # Reporting runs separately from the trusted default branch after completion.
  # No candidate checkout/job receives a callback, provider or production secret.

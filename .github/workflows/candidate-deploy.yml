name: Deploy governed candidate
on:
  workflow_dispatch:
    inputs:
      proposal_key:
        description: Frozen proposal key approved for canary
        required: true
      candidate_version:
        description: Exact validated 40-character commit SHA
        required: true
      runtime_surfaces:
        description: Frozen comma-separated runtime surfaces
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: controller
        shell: bash
    env:
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      CANDIDATE_RUNTIME_SURFACES: ${{ inputs.runtime_surfaces }}
      PROPOSAL_KEY: ${{ inputs.proposal_key }}
      CANDIDATE_SOURCE_ROOT: ${{ github.workspace }}/candidate-source
    steps:
      - name: Checkout trusted controller, never candidate scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Checkout candidate as inert upload data
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_version }}
          path: candidate-source
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v6
        with: {node-version: '20'}
      - name: Install pinned controller tools without deployment credentials
        run: |
          set -euo pipefail
          python -m pip install httpx==0.28.1
          npm install --global @railway/cli@5.71.0 vercel@65.7.0
      - name: Verify immutable regular candidate upload tree
        run: python -I scripts/verify_candidate_deployment_source.py
      - name: Link the isolated candidate Railway project
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_CANDIDATE_TOKEN }}
          RAILWAY_CANDIDATE_PROJECT_ID: ${{ secrets.RAILWAY_CANDIDATE_PROJECT_ID }}
          RAILWAY_CANDIDATE_WORKER_SERVICE: ${{ secrets.RAILWAY_CANDIDATE_WORKER_SERVICE }}
        run: >-
          railway link --project "$RAILWAY_CANDIDATE_PROJECT_ID"
          --environment production --service "$RAILWAY_CANDIDATE_WORKER_SERVICE" --json >/dev/null
      - name: Pin candidate runtime and upload its exact source without executing it locally
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_CANDIDATE_TOKEN }}
          RAILWAY_CANDIDATE_PROJECT_ID: ${{ secrets.RAILWAY_CANDIDATE_PROJECT_ID }}
          RAILWAY_CANDIDATE_WORKER_SERVICE: ${{ secrets.RAILWAY_CANDIDATE_WORKER_SERVICE }}
          RAILWAY_CANDIDATE_REGION: ${{ vars.RAILWAY_CANDIDATE_REGION }}
        run: |
          set -euo pipefail
          region="${RAILWAY_CANDIDATE_REGION:-southeast-asia}"
          printf '%s' "$CANDIDATE_VERSION" | railway variable set EXECUTOR_VERSION --stdin --service "$RAILWAY_CANDIDATE_WORKER_SERVICE" --skip-deploys >/dev/null
          printf '%s' "$CANDIDATE_VERSION" | railway variable set DEPLOYMENT_VERSION --stdin --service "$RAILWAY_CANDIDATE_WORKER_SERVICE" --skip-deploys >/dev/null
          printf '%s' 'candidate' | railway variable set EXECUTOR_ROLE --stdin --service "$RAILWAY_CANDIDATE_WORKER_SERVICE" --skip-deploys >/dev/null
          printf '%s' 'Dockerfile.candidate' | railway variable set RAILWAY_DOCKERFILE_PATH --stdin --service "$RAILWAY_CANDIDATE_WORKER_SERVICE" --skip-deploys >/dev/null
          printf '%s' 'true' | railway variable set EMBEDDED_WORKER_ENABLED --stdin --service "$RAILWAY_CANDIDATE_WORKER_SERVICE" --skip-deploys >/dev/null
          printf '%s' 'false' | railway variable set GOVERNED_IMPROVEMENTS_ENABLED --stdin --service "$RAILWAY_CANDIDATE_WORKER_SERVICE" --skip-deploys >/dev/null
          railway up "$CANDIDATE_SOURCE_ROOT" --path-as-root --project "$RAILWAY_CANDIDATE_PROJECT_ID" --environment production --service "$RAILWAY_CANDIDATE_WORKER_SERVICE" --detach --yes
          railway scale --service "$RAILWAY_CANDIDATE_WORKER_SERVICE" "${region}=1" --json >/dev/null
      - name: Restrict candidate networking to its required surfaces
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_CANDIDATE_TOKEN }}
          RAILWAY_CANDIDATE_WORKER_SERVICE: ${{ secrets.RAILWAY_CANDIDATE_WORKER_SERVICE }}
        run: python -I scripts/configure_candidate_domain.py
      - name: Wait for candidate worker deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_CANDIDATE_TOKEN }}
          RAILWAY_CANDIDATE_WORKER_SERVICE: ${{ secrets.RAILWAY_CANDIDATE_WORKER_SERVICE }}
        run: python -I scripts/wait_candidate_deployment.py
      - name: Deploy immutable candidate frontend preview when required
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CONTROL_FRONTEND_URL: https://google-connector-app.vercel.app
        run: python -I scripts/deploy_candidate_frontend.py
      - name: Verify exact candidate frontend preview when required
        run: python -I scripts/wait_candidate_frontend.py
      - name: Register trusted deployment evidence
        env:
          CANDIDATE_ATTESTATION_URL: ${{ secrets.CANDIDATE_ATTESTATION_URL }}
          CANDIDATE_DEPLOY_ATTESTATION_TOKEN: ${{ secrets.CANDIDATE_DEPLOY_ATTESTATION_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_CANDIDATE_PROJECT_ID }}
          RAILWAY_CANDIDATE_WORKER_SERVICE: ${{ secrets.RAILWAY_CANDIDATE_WORKER_SERVICE }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
        run: python -I scripts/submit_candidate_deployment.py
